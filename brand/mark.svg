<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Daedro">
  <!-- Base link (the D's stem) and the arm's swept arc (the bowl), one continuous path -->
  <path d="M20 52 V12 H30 A20 20 0 0 1 50 32" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 32 A20 20 0 0 1 30 52 H20" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.1 9.4" opacity="0.55"/>
  <!-- Joints -->
  <circle cx="20" cy="12" r="5.2" fill="currentColor"/>
  <circle cx="20" cy="52" r="5.2" fill="currentColor"/>
  <!-- End effector: bronze, after Talos -->
  <circle cx="50" cy="32" r="6" fill="#C8782E"/>
</svg>
