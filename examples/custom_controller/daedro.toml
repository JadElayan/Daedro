# PR: start closing the gripper 0.35 s before the descent finishes, to shave cycle time.
[controller]
module = "pick.py"
class = "WaypointPick"
params = { close_early_s = 0.35 }

[suite]
n = 120
seed = 7

[suite.envelope]
friction  = [0.3, 1.2, "log"]
mass      = [0.05, 0.8, "log"]
half_size = [0.01, 0.035]       # 2 to 7 cm parts
ik_noise  = [0.0, 0.005]
