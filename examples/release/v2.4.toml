# Controller as it is on main.
[controller]
speed = 1.0
grip_force_n = 70

[suite]
method = "lhs"
n = 120
seed = 2026

# Declared operating envelope: the parts this cell is meant to handle.
[suite.envelope]
friction  = [0.2, 1.2, "log"]     # no oily or wet parts
mass      = [0.05, 1.0, "log"]    # up to 1 kg
half_size = [0.015, 0.035]        # 3 to 7 cm cubes
ik_noise  = [0.0, 0.01]           # calibrated arm
