# SO-101 (LeRobot arm) pick-and-place, as on main. Preview support: see docs/so101_preview.md.
[controller]
robot = "so101"

[suite]
n = 60
seed = 5

[suite.envelope]
friction  = [0.25, 1.2, "log"]   # dry plastic / rubber parts
mass      = [0.01, 0.15, "log"]
half_size = [0.009, 0.013]       # 1.8 to 2.6 cm cubes
ik_noise  = [0.0, 0.0001]   # experimental SO-101: noise-free only
