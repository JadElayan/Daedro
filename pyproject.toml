[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daedro"
version = "0.2.0"
description = "Catch robot behaviour regressions before they ship. Paired simulation comparisons for controller changes."
requires-python = ">=3.11"
dependencies = ["mujoco>=3.2", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
daedro = "daedro.cli:main"

[tool.setuptools]
packages = ["daedro"]
